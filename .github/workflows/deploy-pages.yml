name: Sync main to gh-pages

# GitHub Pages 的來源是 gh-pages 分支（分支部署模式）。
# 這個 workflow 在每次 push main 後，把 main 內容同步到 gh-pages，觸發 Pages 重建。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin HEAD:gh-pages --force
